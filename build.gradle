plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	
	// Add GeckoLib official maven repository
	maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }

	// Configure flat directory repository to treat local mod jars as formal dependencies for remapping
	flatDir {
		dirs '..'
	}
}

loom {
	mods {
		"csgo_mc" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Include Fabric API using modImplementation so Loom remaps its classes and access wideners
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Include Point Blank jar as a formal mod dependency so Loom remaps its classes
	modImplementation name: 'pointblank-fabric-1.21.11-2.0.1'

	// Include GeckoLib modImplementation to ensure it gets remapped and loaded at runtime
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.11:5.4.5"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
